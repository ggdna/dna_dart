  dna_index: ^0.2.0
  dna_blog: ^0.3.0
  dna_install: ^0.2.0
  dna_vscode: ^0.4.0
  dna_clean_code: ^0.2.1
  dna_scripts: ^0.3.0
  dna_gg: ^0.10.0
dev_dependencies:
  helix: ^1.12.0
  lints: ^6.1.0
  test: ^1.33.0